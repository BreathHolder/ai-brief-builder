[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-briefing"
version = "0.5.0"
description = "Weekly opinionated AI platform briefing, rendered as a two-voice podcast"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "feedparser>=6.0",
  "trafilatura>=2.0",
  "langdetect>=1.0.9",
  "anthropic>=1.0",
  "openai>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
briefing = "briefing.cli:main"

[tool.setuptools.packages.find]
include = ["briefing*"]

[tool.setuptools.package-data]
briefing = ["*/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
